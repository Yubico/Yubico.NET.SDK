name: Publish a release to NuGet.org
description: >
  Tags the built commit, pushes signed packages to NuGet.org with Trusted Publishing and creates the
  GitHub release. Every step can be re-run: an existing tag on the same commit, packages already on
  NuGet.org and an existing GitHub release are left as they are. Requires id-token: write and
  contents: write. Linux runners only.

inputs:
  tag:
    description: Git tag to create on the built commit.
    required: true
  title:
    description: GitHub release title.
    required: true
  notes-file:
    description: File containing the GitHub release notes.
    required: true
  packages-directory:
    description: Directory containing the signed .nupkg and .snupkg files to publish.
    required: true
  latest:
    description: Whether the GitHub release should be marked as the latest release.
    required: true
  prerelease:
    description: Whether the GitHub release is a prerelease.
    required: true
  nuget-user:
    description: NuGet.org account that owns the Trusted Publishing policy.
    required: true
  github-token:
    description: Token with contents write access.
    required: true

runs:
  using: composite
  steps:
    - name: Find packages
      shell: bash
      env:
        DIRECTORY: ${{ inputs.packages-directory }}
      run: |
        set -euo pipefail
        shopt -s globstar nullglob
        packages=("$DIRECTORY"/**/*.nupkg)
        if [ ${#packages[@]} -eq 0 ]; then
          echo "::error::No packages found in $DIRECTORY"
          exit 1
        fi
        printf '%s\n' "$DIRECTORY"/**/*.nupkg "$DIRECTORY"/**/*.snupkg

    - name: Tag the release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>/dev/null); then
          target=$(jq -r '.object.sha' <<<"$existing")
          if [ "$(jq -r '.object.type' <<<"$existing")" = tag ]; then
            target=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$target" --jq '.object.sha')
          fi
          if [ "$target" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $TAG already exists on $target, not on the built commit $GITHUB_SHA."
            exit 1
          fi
          echo "Tag $TAG already exists on $GITHUB_SHA."
        else
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$TAG" -f message="Release $TAG" -f object="$GITHUB_SHA" -f type=commit --jq '.sha')
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$tag_object" > /dev/null
          echo "Created tag $TAG on $GITHUB_SHA."
        fi

    # The temporary API key is valid for one hour, so log in only once publishing starts.
    - name: Log in to NuGet.org
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841  # v1.2.0
      with:
        user: ${{ inputs.nuget-user }}

    - name: Push packages to NuGet.org
      shell: bash
      env:
        DIRECTORY: ${{ inputs.packages-directory }}
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        set -euo pipefail
        shopt -s globstar nullglob
        source=https://api.nuget.org/v3/index.json

        # --skip-duplicate makes re-runs safe; the release preflight already failed the run if a
        # version existed on NuGet.org before this run started.
        for package in "$DIRECTORY"/**/*.nupkg; do
          dotnet nuget push "$package" --source "$source" --api-key "$NUGET_API_KEY" --no-symbols --skip-duplicate
        done

        # Symbol packages are only accepted once their package has been indexed.
        for package in "$DIRECTORY"/**/*.nupkg; do
          read -r id version < <(python3 - "$package" <<'PY'
        import sys, zipfile, xml.etree.ElementTree as ET
        with zipfile.ZipFile(sys.argv[1]) as package:
            nuspec = next(name for name in package.namelist() if name.endswith(".nuspec") and "/" not in name)
            metadata = ET.fromstring(package.read(nuspec)).find("{*}metadata")
            print(metadata.findtext("{*}id"), metadata.findtext("{*}version"))
        PY
          )
          url="https://api.nuget.org/v3-flatcontainer/${id,,}/${version,,}/${id,,}.${version,,}.nupkg"
          echo "Waiting for $id $version to be indexed..."
          for _ in $(seq 1 90); do
            if curl --silent --fail --head --output /dev/null "$url"; then
              echo "$id $version is available."
              continue 2
            fi
            sleep 30
          done
          echo "::error::$id $version was not indexed within 45 minutes."
          exit 1
        done

        for package in "$DIRECTORY"/**/*.snupkg; do
          dotnet nuget push "$package" --source "$source" --api-key "$NUGET_API_KEY" --skip-duplicate
        done

    - name: Create the GitHub release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ inputs.tag }}
        TITLE: ${{ inputs.title }}
        NOTES_FILE: ${{ inputs.notes-file }}
        DIRECTORY: ${{ inputs.packages-directory }}
        LATEST: ${{ inputs.latest }}
        PRERELEASE: ${{ inputs.prerelease }}
      run: |
        set -euo pipefail
        shopt -s globstar nullglob
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          echo "GitHub release $TAG already exists."
          exit 0
        fi
        gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
          --title "$TITLE" --notes-file "$NOTES_FILE" \
          --latest="$LATEST" --prerelease="$PRERELEASE" \
          "$DIRECTORY"/**/*.nupkg "$DIRECTORY"/**/*.snupkg
