name: Architecture Docs Monthly Synthesis

on:
  # GitHub schedules run only from the repository default branch. Keep this
  # yubikit workflow manually dispatchable; use a default-branch wrapper for cron.
  workflow_dispatch:

# The generator job reads the repository and runs an external tool with an API token; only
# create-pr may write.
permissions:
  contents: read

concurrency:
  group: docs-yubikit
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
    steps:
      - name: Check out yubikit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: yubikit
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: "10.0.x"

      - name: Install pinned Node tools
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          bash scripts/architecture/render-architecture.sh --check

      - name: Fetch architecture baseline
        run: |
          git fetch origin +refs/heads/yubikit:refs/remotes/origin/yubikit

      - name: Build architecture context
        shell: bash
        run: |
          bash ./scripts/architecture/build-architecture-context.sh \
            --mode update \
            --v2-branch origin/yubikit \
            --base-range origin/yubikit~1..HEAD \
            --output-dir .architecture-context

      - name: Synthesize architecture documentation
        uses: anthropics/claude-code-action@769e3bdff9bb7ecfb51bad4c9cba23d6f5fc5ea5 # v1.0.163
        env:
          DISABLE_AUTOUPDATER: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Read and follow `.github/prompts/architecture-docs-monthly-synthesis.md`.
            The generated context is in `.architecture-context/`.
            Improve only architecture documentation files.
          claude_args: >-
            --model opus
            --allowedTools Read,Grep,Glob,Edit,Write,Bash

      - name: Enforce architecture-only edits
        shell: bash
        run: |
          if ! git diff --quiet -- docs/architecture/.state.yml; then
            echo "Monthly synthesis must not edit docs/architecture/.state.yml." >&2
            exit 1
          fi
          outside="$(git status --porcelain --untracked-files=all | while IFS= read -r line; do path="${line#???}"; case "$path" in docs/architecture/*|.architecture-context/*) ;; *) printf '%s\n' "$path" ;; esac; done)"
          if [[ -n "$outside" ]]; then
            echo "Architecture docs automation edited files outside docs/architecture:" >&2
            printf '%s\n' "$outside" >&2
            exit 1
          fi

      - name: Render architecture images
        shell: bash
        run: |
          if git diff --quiet -- docs/architecture/sdk-architecture-diagrams.md; then
            echo "No Mermaid source changes; skipping render."
          else
            bash scripts/architecture/render-architecture.sh
          fi

      - name: Validate architecture documentation
        run: dotnet toolchain.cs -- docs-architecture

      - name: Create architecture patch
        id: patch
        shell: bash
        run: |
          git add -N docs/architecture
          git diff --binary -- docs/architecture > architecture.patch
          echo "has_changes=$([[ -s architecture.patch ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload architecture patch
        if: ${{ steps.patch.outputs.has_changes == 'true' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: architecture-synthesis-patch
          path: architecture.patch
          if-no-files-found: error

  create-pr:
    needs: synthesize
    if: ${{ needs.synthesize.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out yubikit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: yubikit

      - name: Download architecture patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: architecture-synthesis-patch
          path: patches

      - name: Apply architecture patch
        shell: bash
        run: |
          git apply --check --whitespace=error patches/architecture.patch
          git apply --whitespace=error patches/architecture.patch
          outside="$(git status --porcelain --untracked-files=all | while IFS= read -r line; do path="${line#???}"; case "$path" in docs/architecture/*|patches/*) ;; *) printf '%s\n' "$path" ;; esac; done)"
          if [[ -n "$outside" ]]; then
            echo "Architecture patch contains paths outside docs/architecture:" >&2
            printf '%s\n' "$outside" >&2
            exit 1
          fi
          git diff --check

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: "10.0.x"

      - name: Validate architecture documentation
        run: dotnet toolchain.cs -- docs-architecture

      - name: Create architecture synthesis PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automation/architecture-docs-monthly-synthesis
          base: yubikit
          title: Polish architecture documentation
          commit-message: "docs: polish architecture documentation"
          body: |
            Monthly synthesis pass for architecture documentation.

            Review for pedagogy, diagram clarity, evidence-map honesty, and rendered-image freshness.
          add-paths: |
            docs/architecture/
