name: Architecture Docs Preview

on:
  pull_request:
    branches: [ yubikit ]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot' && !endsWith(github.event.pull_request.user.login, '[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Fetch architecture baseline
        run: |
          git fetch origin +refs/heads/yubikit:refs/remotes/origin/yubikit

      - name: Build architecture context
        shell: bash
        run: |
          bash ./scripts/architecture/build-architecture-context.sh \
            --mode preview \
            --v2-branch origin/yubikit \
            --base-range origin/yubikit...HEAD \
            --output-dir .architecture-context

      - name: Comment with architecture documentation preview
        uses: anthropics/claude-code-action@769e3bdff9bb7ecfb51bad4c9cba23d6f5fc5ea5 # v1.0.163
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # github.actor is the pusher, not the PR author. When a human-authored PR
          # receives a commit from the Claude GitHub App, the actor becomes
          # claude[bot] and the action's human-actor check fails the job. The
          # job-level `if` above already blocks bot-authored PRs, and this step only
          # runs a fixed prompt with read-only tools, so allow just this bot.
          allowed_bots: claude
          prompt: |
            Read and follow `.github/prompts/architecture-docs-pr-preview.md`.
            The generated context is in `.architecture-context/`.
            Preview mode must comment on architecture diagram impact only; do not edit files.
          claude_args: >-
            --model sonnet
            --allowedTools Read,Grep,Glob
