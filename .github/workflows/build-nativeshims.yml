name: Build Yubico.NativeShims

on:
  workflow_dispatch:
    inputs:
      push-to-dev:
        description: 'Push to internal NuGet'
        required: true
        type: boolean
      version:
        description: 'Version (optional; a unique prerelease is generated when omitted)'
        required: false
        default: ""
        type: string
  schedule:
    - cron: '0 0 * * *' # Every day at midnight

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-2022
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: |
          echo 'Running build script: Windows'
          cd Yubico.NativeShims
          if ("${{ github.event.inputs.version }}" -ne "") {
            $versionInput = "${{ github.event.inputs.version }}"
            if ($versionInput -like "*-*") {
              $baseVersion = $versionInput.Split('-')[0]
            } else {
              Write-Warning "Version input does not contain a hyphen ('-'). Using the full version string as base version."
              $baseVersion = $versionInput
            }
            & ./build-windows.ps1 -Version $baseVersion
          } else {
            & ./build-windows.ps1
          }
      - name: Verify no VC++ Redistributable dependency
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd Yubico.NativeShims
          set FAILED=0
          for %%a in (win-x64 win-x86 win-arm64) do (
            echo Checking %%a\Yubico.NativeShims.dll for CRT dependencies...
            dumpbin /imports %%a\Yubico.NativeShims.dll | findstr /i "VCRUNTIME api-ms-win-crt" && (
              echo FAIL: %%a\Yubico.NativeShims.dll has VC++ Redistributable dependency
              set FAILED=1
            ) || (
              echo PASS: %%a\Yubico.NativeShims.dll has no CRT dependencies
            )
          )
          if %FAILED%==1 exit /b 1
          echo All Windows builds verified: no VC++ Redistributable required
          exit /b 0
      - name: Verify export tables match canonical symbol list
        shell: pwsh
        run: |
          # Set up VC++ environment so dumpbin is on PATH for arm64 inspection
          & "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64
          $script = "$PWD\Yubico.NativeShims\tests\check_exports.ps1"
          $failed = $false
          foreach ($arch in @('win-x64', 'win-x86', 'win-arm64')) {
              Write-Host "=== Checking $arch\Yubico.NativeShims.dll ==="
              & $script "$PWD\Yubico.NativeShims\$arch\Yubico.NativeShims.dll"
              if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
          Write-Host "All Windows export tables match canonical symbol list."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: win-x64
          path: |
            Yubico.NativeShims/win-x64/*.dll
            Yubico.NativeShims/win-x64/static/**
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: win-x86
          path: |
            Yubico.NativeShims/win-x86/*.dll
            Yubico.NativeShims/win-x86/static/**
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: win-arm64
          path: |
            Yubico.NativeShims/win-arm64/*.dll
            Yubico.NativeShims/win-arm64/static/**
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nuspec
          path: | 
            Yubico.NativeShims/*.nuspec
            Yubico.NativeShims/readme.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: msbuild
          path: Yubico.NativeShims/msbuild/*

  build-linux-amd64:
    name: Build Linux (amd64)
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig (pinned version)
        run: |
          ZIG_VERSION="0.15.2"
          ZIG_ARCH="x86_64-linux"
          ZIG_TARBALL="zig-${ZIG_ARCH}-${ZIG_VERSION}.tar.xz"
          ZIG_URL="https://ziglang.org/download/${ZIG_VERSION}/${ZIG_TARBALL}"
          ZIG_MINISIG_URL="${ZIG_URL}.minisig"
          # Official Zig minisign public key
          ZIG_PUBKEY="RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U"

          echo "Installing minisign for signature verification..."
          sudo apt-get update -qq
          sudo apt-get install -y minisign

          echo "Downloading Zig ${ZIG_VERSION}..."
          wget -q "${ZIG_URL}"
          wget -q "${ZIG_MINISIG_URL}"

          echo "Verifying signature with minisign..."
          minisign -Vm "${ZIG_TARBALL}" -P "${ZIG_PUBKEY}"

          echo "✅ Signature verified! Extracting and installing..."
          tar -xf "${ZIG_TARBALL}"
          sudo mv "zig-${ZIG_ARCH}-${ZIG_VERSION}" /usr/local/zig
          echo "/usr/local/zig" >> $GITHUB_PATH

          echo "Zig installed successfully:"
          /usr/local/zig/zig version
      - name: Setup Zig CC wrappers
        run: |
          echo 'Creating Zig CC wrapper scripts'
          mkdir -p $HOME/zig-wrappers

          # Create x86_64 C compiler wrapper
          cat > $HOME/zig-wrappers/zig-cc << 'EOF'
          #!/bin/bash
          exec zig cc -target x86_64-linux-gnu.2.23 -O2 -s "$@"
          EOF

          # Create x86_64 C++ compiler wrapper
          cat > $HOME/zig-wrappers/zig-c++ << 'EOF'
          #!/bin/bash
          exec zig c++ -target x86_64-linux-gnu.2.23 -O2 -s "$@"
          EOF

          chmod +x $HOME/zig-wrappers/zig-cc
          chmod +x $HOME/zig-wrappers/zig-c++

          echo "CC=$HOME/zig-wrappers/zig-cc" >> $GITHUB_ENV
          echo "CXX=$HOME/zig-wrappers/zig-c++" >> $GITHUB_ENV
      - name: Verify Zig wrappers
        run: |
          echo "Verifying Zig wrapper scripts..."
          test -x $HOME/zig-wrappers/zig-cc || { echo "ERROR: zig-cc not executable"; exit 1; }
          test -x $HOME/zig-wrappers/zig-c++ || { echo "ERROR: zig-c++ not executable"; exit 1; }

          echo "Testing zig-cc wrapper:"
          $HOME/zig-wrappers/zig-cc --version | grep -q "zig" || { echo "ERROR: zig-cc not using Zig"; exit 1; }

          echo "✅ Zig wrappers verified successfully"
      - run: |
          echo 'Running build script: Linux (amd64) with Zig targeting glibc 2.23'
          cd Yubico.NativeShims
          if [ ! -z "${{ github.event.inputs.version }}" ]; then
            BASE_VERSION=$(echo "${{ github.event.inputs.version }}" | cut -d'-' -f1)
            bash ./build-linux-amd64.sh "$BASE_VERSION"
          else
            bash ./build-linux-amd64.sh
          fi
      - name: Test on Ubuntu 18.04 (glibc 2.27)
        working-directory: Yubico.NativeShims
        run: |
          echo "Testing binary compatibility on Ubuntu 18.04 (close to target glibc 2.23)..."
          docker run --rm \
            -v $PWD/linux-x64:/test:ro \
            ubuntu:18.04 \
            bash -c '
              set -e
              apt-get update -qq
              apt-get install -y libpcsclite1 file binutils
              cd /test
              echo "Testing on Ubuntu 18.04 (glibc 2.27)..."
              ldd --version | head -n1
              echo ""
              echo "Library dependencies:"
              ldd *.so || true
              echo ""
              echo "GLIBC version requirements:"
              readelf -V *.so | grep GLIBC_2 | sort -u
              echo ""
              echo "✅ Binary compatible with Ubuntu 18.04 (glibc 2.27)"
            '
      - name: Test on Ubuntu 20.04 (glibc 2.31)
        working-directory: Yubico.NativeShims
        run: |
          echo "Testing binary compatibility on Ubuntu 20.04..."
          docker run --rm \
            -v $PWD/linux-x64:/test:ro \
            ubuntu:20.04 \
            bash -c '
              set -e
              apt-get update -qq
              apt-get install -y libpcsclite1 file binutils
              cd /test
              echo "Files found:"
              ls -lh *.so
              echo ""
              echo "File types:"
              file *.so
              echo ""
              echo "Library dependencies:"
              ldd *.so || true
              echo ""
              echo "GLIBC version requirements:"
              readelf -V *.so | grep GLIBC_2 | sort -u
              echo ""
              echo "✅ Binary loads successfully on Ubuntu 20.04 (glibc 2.31)"
            '
      - name: Test on Debian 10 (glibc 2.28)
        working-directory: Yubico.NativeShims
        run: |
          echo "Testing binary compatibility on Debian 10 (target: glibc 2.23)..."
          docker run --rm \
            -v $PWD/linux-x64:/test:ro \
            debian:10 \
            bash -c '
              set -e
              # Debian 10 is EOL, update sources to use archive repository
              sed -i "s|http://deb.debian.org|http://archive.debian.org|g" /etc/apt/sources.list
              sed -i "s|http://security.debian.org|http://archive.debian.org|g" /etc/apt/sources.list
              sed -i "/buster-updates/d" /etc/apt/sources.list
              apt-get update -qq
              apt-get install -y libpcsclite1 file binutils
              cd /test
              echo "Testing on Debian 10 (glibc 2.28, target is 2.23)..."
              ldd --version | head -n1
              ldd *.so
              readelf -V *.so | grep GLIBC_2 | sort -u
              echo "✅ Binary compatible with Debian 10 (glibc 2.28)"
            '
      - name: Verify export table matches canonical symbol list
        working-directory: Yubico.NativeShims
        run: |
          bash tests/check_exports.sh linux-x64/libYubico.NativeShims.so
      - name: Verify >= 64 KB page alignment of LOAD segments
        working-directory: Yubico.NativeShims
        run: |
          bash tests/check_alignment.sh linux-x64/libYubico.NativeShims.so
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-x64
          path: |
            Yubico.NativeShims/linux-x64/*.so
            Yubico.NativeShims/linux-x64/static/**
          
  build-linux-arm64:
    name: Build Linux (arm64)
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig (pinned version)
        run: |
          ZIG_VERSION="0.15.2"
          ZIG_ARCH="x86_64-linux"
          ZIG_TARBALL="zig-${ZIG_ARCH}-${ZIG_VERSION}.tar.xz"
          ZIG_URL="https://ziglang.org/download/${ZIG_VERSION}/${ZIG_TARBALL}"
          ZIG_MINISIG_URL="${ZIG_URL}.minisig"
          # Official Zig minisign public key
          ZIG_PUBKEY="RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U"

          echo "Installing minisign for signature verification..."
          sudo apt-get update -qq
          sudo apt-get install -y minisign

          echo "Downloading Zig ${ZIG_VERSION}..."
          wget -q "${ZIG_URL}"
          wget -q "${ZIG_MINISIG_URL}"

          echo "Verifying signature with minisign..."
          minisign -Vm "${ZIG_TARBALL}" -P "${ZIG_PUBKEY}"

          echo "✅ Signature verified! Extracting and installing..."
          tar -xf "${ZIG_TARBALL}"
          sudo mv "zig-${ZIG_ARCH}-${ZIG_VERSION}" /usr/local/zig
          echo "/usr/local/zig" >> $GITHUB_PATH

          echo "Zig installed successfully:"
          /usr/local/zig/zig version
      - name: Setup Zig CC wrappers
        run: |
          echo 'Creating Zig CC wrapper scripts for ARM64 cross-compilation'
          mkdir -p $HOME/zig-wrappers

          # Create aarch64 C compiler wrapper
          cat > $HOME/zig-wrappers/zig-cc << 'EOF'
          #!/bin/bash
          exec zig cc -target aarch64-linux-gnu.2.23 -O2 -s "$@"
          EOF

          # Create aarch64 C++ compiler wrapper
          cat > $HOME/zig-wrappers/zig-c++ << 'EOF'
          #!/bin/bash
          exec zig c++ -target aarch64-linux-gnu.2.23 -O2 -s "$@"
          EOF

          chmod +x $HOME/zig-wrappers/zig-cc
          chmod +x $HOME/zig-wrappers/zig-c++

          echo "CC=$HOME/zig-wrappers/zig-cc" >> $GITHUB_ENV
          echo "CXX=$HOME/zig-wrappers/zig-c++" >> $GITHUB_ENV
      - name: Verify Zig wrappers
        run: |
          echo "Verifying Zig wrapper scripts..."
          test -x $HOME/zig-wrappers/zig-cc || { echo "ERROR: zig-cc not executable"; exit 1; }
          test -x $HOME/zig-wrappers/zig-c++ || { echo "ERROR: zig-c++ not executable"; exit 1; }

          echo "Testing zig-cc wrapper:"
          $HOME/zig-wrappers/zig-cc --version | grep -q "zig" || { echo "ERROR: zig-cc not using Zig"; exit 1; }

          echo "✅ Zig wrappers verified successfully"
      - run: |
          echo 'Running build script: Linux (arm64) with Zig targeting glibc 2.23'
          cd Yubico.NativeShims
          if [ ! -z "${{ github.event.inputs.version }}" ]; then
            BASE_VERSION=$(echo "${{ github.event.inputs.version }}" | cut -d'-' -f1)
            bash ./build-linux-arm64.sh "$BASE_VERSION"
          else
            bash ./build-linux-arm64.sh
          fi
      - name: Set up QEMU for ARM64 testing
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - name: Test on Ubuntu 18.04 (glibc 2.27)
        working-directory: Yubico.NativeShims
        run: |
          echo "Testing ARM64 binary compatibility on Ubuntu 18.04 (close to target glibc 2.23)..."
          docker run --rm --platform linux/arm64 \
            -v $PWD/linux-arm64:/test:ro \
            ubuntu:18.04 \
            bash -c '
              set -e
              apt-get update -qq
              apt-get install -y libpcsclite1 file binutils
              cd /test
              echo "Testing on Ubuntu 18.04 (glibc 2.27)..."
              ldd --version | head -n1
              echo ""
              echo "Library dependencies:"
              ldd *.so || true
              echo ""
              echo "GLIBC version requirements:"
              readelf -V *.so | grep GLIBC_2 | sort -u
              echo ""
              echo "✅ ARM64 binary compatible with Ubuntu 18.04 (glibc 2.27)"
            '
      - name: Test on Ubuntu 20.04 (glibc 2.31)
        working-directory: Yubico.NativeShims
        run: |
          echo "Testing ARM64 binary compatibility on Ubuntu 20.04..."
          docker run --rm --platform linux/arm64 \
            -v $PWD/linux-arm64:/test:ro \
            ubuntu:20.04 \
            bash -c '
              set -e
              apt-get update -qq
              apt-get install -y libpcsclite1 file binutils
              cd /test
              echo "Files found:"
              ls -lh *.so
              echo ""
              echo "File types:"
              file *.so
              echo ""
              echo "Library dependencies:"
              ldd *.so || true
              echo ""
              echo "GLIBC version requirements:"
              readelf -V *.so | grep GLIBC_2 | sort -u
              echo ""
              echo "✅ ARM64 binary loads successfully on Ubuntu 20.04 (glibc 2.31)"
            '
      - name: Test on Debian 10 (glibc 2.28)
        working-directory: Yubico.NativeShims
        run: |
          echo "Testing ARM64 binary compatibility on Debian 10 (target: glibc 2.23)..."
          docker run --rm --platform linux/arm64 \
            -v $PWD/linux-arm64:/test:ro \
            debian:10 \
            bash -c '
              set -e
              # Debian 10 is EOL, update sources to use archive repository
              sed -i "s|http://deb.debian.org|http://archive.debian.org|g" /etc/apt/sources.list
              sed -i "s|http://security.debian.org|http://archive.debian.org|g" /etc/apt/sources.list
              sed -i "/buster-updates/d" /etc/apt/sources.list
              apt-get update -qq
              apt-get install -y libpcsclite1 file binutils
              cd /test
              echo "Testing on Debian 10 (glibc 2.28, target is 2.23)..."
              ldd --version | head -n1
              ldd *.so
              readelf -V *.so | grep GLIBC_2 | sort -u
              echo "✅ ARM64 binary compatible with Debian 10 (glibc 2.28)"
            '
      - name: Verify export table matches canonical symbol list
        working-directory: Yubico.NativeShims
        run: |
          # nm reads ELF metadata regardless of target arch — works on x86_64 host inspecting aarch64 .so
          bash tests/check_exports.sh linux-arm64/libYubico.NativeShims.so
      - name: Verify 16 KB/64 KB page alignment of LOAD segments
        working-directory: Yubico.NativeShims
        run: |
          # readelf reads ELF metadata regardless of target arch — works on x86_64 host inspecting aarch64 .so
          bash tests/check_alignment.sh linux-arm64/libYubico.NativeShims.so
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-arm64
          path: |
            Yubico.NativeShims/linux-arm64/*.so
            Yubico.NativeShims/linux-arm64/static/**

  build-macos:
    name: Build macOS
    runs-on: macos-14
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: |
          echo 'Running build script: macOS'
          cd Yubico.NativeShims
          if [ ! -z "${{ github.event.inputs.version }}" ]; then
            BASE_VERSION=$(echo "${{ github.event.inputs.version }}" | cut -d'-' -f1)
            sh ./build-macOS.sh "$BASE_VERSION"
          else
            sh ./build-macOS.sh
          fi
      - name: Verify export tables match canonical symbol list
        working-directory: Yubico.NativeShims
        run: |
          set -e
          for arch in osx-x64 osx-arm64; do
              echo "=== Checking $arch/libYubico.NativeShims.dylib ==="
              bash tests/check_exports.sh "$arch/libYubico.NativeShims.dylib"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: osx-x64
          path: |
            Yubico.NativeShims/osx-x64/*.dylib
            Yubico.NativeShims/osx-x64/static/**
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: osx-arm64
          path: |
            Yubico.NativeShims/osx-arm64/*.dylib
            Yubico.NativeShims/osx-arm64/static/**

  pack:
    name: Package artifacts
    outputs:
      package-version: ${{ steps.package-metadata.outputs.package-version }}
    permissions:
      id-token: write
      contents: read
      packages: read
      attestations: write
    runs-on: windows-2022
    needs: [build-windows, build-linux-amd64, build-linux-arm64, build-macos]
    env:
      PACKAGE_VERSION: ${{ inputs.version != '' && inputs.version || format('0.0.0-prerelease.{0}.{1}', github.run_id, github.run_attempt) }}
      GITHUB_REPO_URL: https://github.com/${{ github.repository }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Download contents, set metadata and package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      - name: Set package metadata
        id: package-metadata
        shell: pwsh
        run: |
          if ($env:PACKAGE_VERSION -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$') {
            throw "Version must use canonical three-component SemVer: $env:PACKAGE_VERSION"
          }
          "package-version=$env:PACKAGE_VERSION" >> $env:GITHUB_OUTPUT
          mv nuspec/*.nuspec .
          mv nuspec/readme.md .
          $nuspec = [xml](gc Yubico.NativeShims.nuspec)
          $repo = $nuspec.CreateElement("repository")
          $repo.SetAttribute("url","$env:GITHUB_REPO_URL")
          $repo.SetAttribute("type","git")
          $nuspec.package.metadata.AppendChild($repo)
          $nuspec.package.metadata.version = "$env:PACKAGE_VERSION"
          $nuspec.Save("Yubico.NativeShims.nuspec")
          cat Yubico.NativeShims.nuspec
      - name: Verify static archives and pack
        shell: pwsh
        run: |
          $archives = @(
            'win-x64/static/Yubico.NativeShims.lib',
            'win-x86/static/Yubico.NativeShims.lib',
            'win-arm64/static/Yubico.NativeShims.lib',
            'linux-x64/static/libYubico.NativeShims.a',
            'linux-arm64/static/libYubico.NativeShims.a',
            'osx-x64/static/libYubico.NativeShims.a',
            'osx-arm64/static/libYubico.NativeShims.a'
          )

          foreach ($archive in $archives) {
            if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
              throw "Expected static archive is missing: $archive"
            }
          }

          nuget pack Yubico.NativeShims.nuspec
          if ($LASTEXITCODE -ne 0) { throw "nuget pack failed with exit code $LASTEXITCODE." }

          $packages = @(Get-ChildItem -File -Filter 'Yubico.NativeShims.*.nupkg')
          if ($packages.Count -ne 1) {
            throw "Expected exactly one NativeShims package, found $($packages.Count)."
          }

          $package = $packages[0]
          $packageZip = Join-Path $PWD 'NativeShims-package.zip'
          $packageContents = Join-Path $PWD 'NativeShims-package-contents'
          Copy-Item -LiteralPath $package.FullName -Destination $packageZip
          Expand-Archive -LiteralPath $packageZip -DestinationPath $packageContents

          $packagedArchives = @(
            'runtimes/win-x64/native/static/Yubico.NativeShims.lib',
            'runtimes/win-x86/native/static/Yubico.NativeShims.lib',
            'runtimes/win-arm64/native/static/Yubico.NativeShims.lib',
            'runtimes/linux-x64/native/static/libYubico.NativeShims.a',
            'runtimes/linux-arm64/native/static/libYubico.NativeShims.a',
            'runtimes/osx-x64/native/static/libYubico.NativeShims.a',
            'runtimes/osx-arm64/native/static/libYubico.NativeShims.a'
          )

          foreach ($archive in $packagedArchives) {
            $packagePath = Join-Path $packageContents $archive
            if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf)) {
              throw "Expected packaged static archive is missing: $archive"
            }
          }

          "### NativeShims package measurements" >> $env:GITHUB_STEP_SUMMARY
          "| Artifact | Bytes |" >> $env:GITHUB_STEP_SUMMARY
          "| --- | ---: |" >> $env:GITHUB_STEP_SUMMARY
          "| $($package.Name) | $($package.Length) |" >> $env:GITHUB_STEP_SUMMARY
          foreach ($archive in $archives) {
            $item = Get-Item -LiteralPath $archive
            "| $archive | $($item.Length) |" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload Nuget Package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: NuGet Package NativeShims
          path: Yubico.NativeShims.*.nupkg

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            win-*/*.dll
            win-*/static/*.lib
            linux-*/*.so
            linux-*/static/*.a
            osx-*/*.dylib
            osx-*/static/*.a
            Yubico.NativeShims.*.nupkg

  verify-native-aot:
    name: Native AOT (${{ matrix.rid }})
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2022
            os: windows
            host-arch: amd64
          - rid: win-x86
            runner: windows-2022
            os: windows
            host-arch: amd64
          - rid: win-arm64
            runner: windows-11-arm
            os: windows
            host-arch: arm64
          - rid: linux-x64
            runner: ubuntu-24.04
            os: linux
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
          - rid: osx-x64
            runner: macos-15-intel
            os: macos
          - rid: osx-arm64
            runner: macos-14
            os: macos
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json

      - name: Install Linux Native AOT prerequisites
        if: ${{ matrix.os == 'linux' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang zlib1g-dev libpcsclite-dev binutils

      - name: Download current-run package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: NuGet Package NativeShims
          path: artifacts/package-source

      - name: Restore exact package and publish probe
        shell: pwsh
        env:
          NATIVE_SHIMS_VERSION: ${{ needs.pack.outputs.package-version }}
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'Yubico.NativeShims/tests/NativeAotProbe/NativeAotProbe.csproj'
          $packageSource = (Resolve-Path (Join-Path $env:GITHUB_WORKSPACE 'artifacts/package-source')).Path
          $packagesPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/packages/${{ matrix.rid }}'
          $outputPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/publish/${{ matrix.rid }}'
          $nupkgs = @(Get-ChildItem -LiteralPath $packageSource -File -Filter '*.nupkg')

          if ($nupkgs.Count -ne 1) {
            throw "Expected exactly one current-run package, found $($nupkgs.Count)."
          }

          $expectedPackageName = "Yubico.NativeShims.$env:NATIVE_SHIMS_VERSION.nupkg"
          if ($nupkgs[0].Name -cne $expectedPackageName) {
            throw "Expected package '$expectedPackageName', found '$($nupkgs[0].Name)'."
          }

          # Prime the Native AOT runtime packs and evaluate the package's AOT assets.
          dotnet restore $project `
            -r '${{ matrix.rid }}' `
            --packages $packagesPath `
            --no-cache `
            --source $packageSource `
            --source 'https://api.nuget.org/v3/index.json' `
            -p:NativeShimsVersion=$env:NATIVE_SHIMS_VERSION `
            -p:PublishAot=true
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed with exit code $LASTEXITCODE." }

          $assets = Get-Content (Join-Path (Split-Path $project) 'obj/project.assets.json') -Raw | ConvertFrom-Json
          $resolvedPackages = @($assets.libraries.PSObject.Properties.Name | Where-Object {
              $_.StartsWith('Yubico.NativeShims/', [StringComparison]::OrdinalIgnoreCase)
            })
          $expectedPackage = "Yubico.NativeShims/$env:NATIVE_SHIMS_VERSION"
          if ($resolvedPackages.Count -ne 1 -or
              -not $resolvedPackages[0].Equals($expectedPackage, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Expected exact package '$expectedPackage'; resolved '$($resolvedPackages -join ', ')'."
          }

          $expectedHash = [Convert]::ToBase64String(
            [Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes($nupkgs[0].FullName)))
          $installedHashPath = Join-Path $packagesPath "yubico.nativeshims/$($env:NATIVE_SHIMS_VERSION.ToLowerInvariant())/yubico.nativeshims.$($env:NATIVE_SHIMS_VERSION.ToLowerInvariant()).nupkg.sha512"
          $installedHash = (Get-Content -LiteralPath $installedHashPath -Raw).Trim()
          if ($installedHash -cne $expectedHash) {
            throw "Restored NativeShims package does not match the current-run package artifact."
          }

          dotnet publish $project `
            -c Release `
            -r '${{ matrix.rid }}' `
            --no-restore `
            -o $outputPath `
            -p:NativeShimsVersion=$env:NATIVE_SHIMS_VERSION `
            -p:RestorePackagesPath=$packagesPath `
            -p:PublishAot=true `
            -p:ContinuousIntegrationBuild=true
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE." }

      - name: Remove shared shim and verify native output
        shell: pwsh
        run: |
          $outputPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/publish/${{ matrix.rid }}'
          $isWindows = '${{ matrix.os }}' -eq 'windows'
          $executable = Join-Path $outputPath $(if ($isWindows) { 'NativeAotProbe.exe' } else { 'NativeAotProbe' })
          $sharedName = switch ('${{ matrix.os }}') {
            'windows' { 'Yubico.NativeShims.dll' }
            'linux' { 'libYubico.NativeShims.so' }
            'macos' { 'libYubico.NativeShims.dylib' }
          }

          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Native AOT executable is missing: $executable"
          }

          $sharedCopies = @(Get-ChildItem -LiteralPath $outputPath -Recurse -File | Where-Object {
              $_.Name.Equals($sharedName, [StringComparison]::OrdinalIgnoreCase)
            })
          if ($sharedCopies.Count -ne 0) {
            throw "Shared NativeShims library remains in AOT publish output: $($sharedCopies.FullName -join ', ')"
          }

          if (Test-Path -LiteralPath (Join-Path $outputPath 'NativeAotProbe.dll')) {
            throw "Managed NativeAotProbe.dll was published; package targets did not enable Native AOT."
          }

          "### Native AOT ${{ matrix.rid }}" >> $env:GITHUB_STEP_SUMMARY
          "* Executable bytes: $((Get-Item -LiteralPath $executable).Length)" >> $env:GITHUB_STEP_SUMMARY
          "* Shared shim copies: $($sharedCopies.Count)" >> $env:GITHUB_STEP_SUMMARY

      - name: Inspect dynamic dependencies
        shell: pwsh
        run: |
          $outputPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/publish/${{ matrix.rid }}'
          $executable = Join-Path $outputPath $(if ('${{ matrix.os }}' -eq 'windows') { 'NativeAotProbe.exe' } else { 'NativeAotProbe' })

          switch ('${{ matrix.os }}') {
            'windows' {
              $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
              if (-not (Test-Path -LiteralPath $vswhere)) {
                $vswhere = "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"
              }
              if (-not (Test-Path -LiteralPath $vswhere)) {
                throw "vswhere.exe was not found."
              }
              $installationPath = (& $vswhere -latest -products * -property installationPath | Select-Object -First 1)
              $devShell = Join-Path $installationPath 'Common7/Tools/Launch-VsDevShell.ps1'
              if (-not (Test-Path -LiteralPath $devShell)) {
                throw "Visual Studio developer shell not found: $devShell"
              }
              & $devShell -SkipAutomaticLocation -Arch '${{ matrix.host-arch }}'
              $dependencies = (& dumpbin /dependents $executable 2>&1 | Out-String)
            }
            'linux' {
              $dependencies = (& readelf -d $executable 2>&1 | Out-String)
            }
            'macos' {
              $dependencies = (& otool -L $executable 2>&1 | Out-String)
            }
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Dependency inspection failed with exit code $LASTEXITCODE.`n$dependencies"
          }
          Write-Host $dependencies
          if ($dependencies -match '(?i)Yubico\.NativeShims') {
            throw "Published executable dynamically depends on NativeShims."
          }

      - name: Verify hardened Linux dynamic exports
        if: ${{ matrix.os == 'linux' }}
        shell: pwsh
        run: |
          $executable = Join-Path $env:GITHUB_WORKSPACE 'artifacts/publish/${{ matrix.rid }}/NativeAotProbe'
          $dynamicSymbols = @(& nm -D --defined-only $executable 2>&1)
          if ($LASTEXITCODE -ne 0) {
            throw "nm failed with exit code $LASTEXITCODE.`n$($dynamicSymbols -join [Environment]::NewLine)"
          }

          $opensslSymbols = @($dynamicSymbols | Where-Object {
              $_ -match '\b(EVP_|BN_|OPENSSL_|CRYPTO_)'
            })
          "* OpenSSL-style dynamic exports: $($opensslSymbols.Count)" >> $env:GITHUB_STEP_SUMMARY
          if ($opensslSymbols.Count -ne 0) {
            throw "OpenSSL-style dynamic exports remain:`n$($opensslSymbols -join [Environment]::NewLine)"
          }

      - name: Execute package-only probe
        shell: pwsh
        run: |
          $outputPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/publish/${{ matrix.rid }}'
          $executable = Join-Path $outputPath $(if ('${{ matrix.os }}' -eq 'windows') { 'NativeAotProbe.exe' } else { 'NativeAotProbe' })
          & $executable
          if ($LASTEXITCODE -ne 0) { throw "Native AOT probe failed with exit code $LASTEXITCODE." }

  publish-internal:
    name: Publish to internal NuGet
    runs-on: windows-2022
    needs: verify-native-aot
    environment: Internal NuGet feed
    permissions:
      packages: write
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.push-to-dev }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: NuGet Package NativeShims
      - run: |
          dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/Yubico/index.json"
          dotnet nuget push Yubico.NativeShims.*.nupkg --source "github" --api-key ${{ secrets.GITHUB_TOKEN }}
