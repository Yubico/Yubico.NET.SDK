name: Build and Test (2.0)

on:
  push:
    branches: [ yubikit*, yubikit/** ]
  pull_request:
    branches: [ yubikit*, yubikit/** ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      # Never pass private-feed access to code from fork pull requests.
      NuGetPackageSourceCredentials_Yubico_GH: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('Username={0};Password={1}', github.actor, secrets.GITHUB_TOKEN) || '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Test generated documentation patch guards
        run: python3 scripts/docs/test-docs-patches.py

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Validate active documentation
        run: dotnet toolchain.cs -- docs-qa

      - name: Validate architecture documentation
        run: dotnet toolchain.cs -- docs-architecture

      - name: Install PC/SC dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pcscd libpcsclite-dev libudev-dev
          # Run pcscd directly (bypasses systemd/socket-activation issues on CI runners)
          # and open socket permissions so the test runner user can connect
          sudo mkdir -p /run/pcscd
          sudo pcscd --foreground &
          # Wait for socket to appear (more robust than fixed sleep)
          timeout 10 bash -c 'until [ -S /run/pcscd/pcscd.comm ]; do sleep 0.2; done' || true
          # Open socket read/write for the runner user (sockets don't need +x)
          sudo chmod 666 /run/pcscd/pcscd.comm || true

      - name: Build
        run: dotnet toolchain.cs build

      - name: Run unit tests
        run: dotnet toolchain.cs test

      - name: Run portable Windows HID verification evidence guards
        run: dotnet toolchain.cs windows-hid-verification-evidence-test

      - name: Run runtime resilience checks
        run: dotnet toolchain.cs -- resilience --fast

      - name: Pack NuGet packages
        run: dotnet toolchain.cs pack --package-version 2.0.0-alpha.2

      - name: Attest build provenance for packages
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: 'artifacts/packages/*.nupkg'

      - name: Publish to GitHub Packages
        if: github.event_name == 'push'
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet toolchain.cs publish-remote --nuget-feed-url https://nuget.pkg.github.com/Yubico/index.json

      - name: Capture failure diagnostics
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          diagnostics=artifacts/ci-failure
          mkdir -p "$diagnostics/probes"
          {
            uname -srm
            printf 'Available CPUs: '
            nproc
            printf 'Probe temp directory: %s\n' "${TMPDIR:-/tmp}"
            if command -v dotnet >/dev/null 2>&1; then
              dotnet --info || printf '.NET runtime context could not be read.\n'
            else
              printf '.NET is unavailable; SDK setup may not have completed.\n'
            fi
          } > "$diagnostics/runtime-context.txt" 2>&1
          # Path.GetTempPath() uses TMPDIR on this Linux job, falling back to /tmp.
          # Collect only the isolated helper's known output files, never the temp tree.
          shopt -s nullglob
          for log in "${TMPDIR:-/tmp}"/yubikit-pcsc-*-probe.log; do
            if [[ -f "$log" && ! -L "$log" ]]; then
              cp -- "$log" "$diagnostics/probes/"
              if [[ "${log##*/}" == yubikit-pcsc-linux-fido-finalizer-probe.log ]]; then
                printf '\nLinux FIDO finalizer child output (%s):\n' "$log"
                cat -- "$log"
              fi
            fi
          done

      - name: Upload failure diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: build-failure-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          # Toolchain retention already bounds runs to the five newest directories.
          path: |
            artifacts/toolchain/runs/*/*.log
            artifacts/toolchain/runs/*/result.json
            artifacts/toolchain/runs/*/result.txt
            artifacts/ci-failure/runtime-context.txt
            artifacts/ci-failure/probes/yubikit-pcsc-*-probe.log
          if-no-files-found: warn
          retention-days: 7
