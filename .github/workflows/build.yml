name: Build and Test (2.0)

on:
  push:
    branches: [ yubikit*, yubikit/** ]
  pull_request:
    branches: [ yubikit*, yubikit/** ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      NativeShimsPackageVersion: "1.17.4-prerelease.20260825.3"
      NuGetPackageSourceCredentials_yubico_internal: "Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic"
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: "10.0.x"

      - name: Configure internal NativeShims package source
        shell: pwsh
        run: |
          dotnet nuget add source https://nuget.pkg.github.com/Yubico/index.json --name yubico_internal --configfile nuget.config

          [xml]$config = Get-Content -Raw nuget.config
          $mapping = $config.CreateElement("packageSourceMapping")
          $publicSource = $config.CreateElement("packageSource")
          $publicSource.SetAttribute("key", "nuget.org")
          $publicPattern = $config.CreateElement("package")
          $publicPattern.SetAttribute("pattern", "*")
          [void]$publicSource.AppendChild($publicPattern)
          [void]$mapping.AppendChild($publicSource)
          $internalSource = $config.CreateElement("packageSource")
          $internalSource.SetAttribute("key", "yubico_internal")
          $internalPattern = $config.CreateElement("package")
          $internalPattern.SetAttribute("pattern", "Yubico.NativeShims")
          [void]$internalSource.AppendChild($internalPattern)
          [void]$mapping.AppendChild($internalSource)
          [void]$config.configuration.AppendChild($mapping)
          $config.Save((Resolve-Path nuget.config).Path)

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Validate active documentation
        run: dotnet toolchain.cs -- docs-qa

      - name: Validate architecture documentation
        run: dotnet toolchain.cs -- docs-architecture

      - name: Install PC/SC dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pcscd libpcsclite-dev libudev-dev
          # Run pcscd directly (bypasses systemd/socket-activation issues on CI runners)
          # and open socket permissions so the test runner user can connect
          sudo mkdir -p /run/pcscd
          sudo pcscd --foreground &
          # Wait for socket to appear (more robust than fixed sleep)
          timeout 10 bash -c 'until [ -S /run/pcscd/pcscd.comm ]; do sleep 0.2; done' || true
          # Open socket read/write for the runner user (sockets don't need +x)
          sudo chmod 666 /run/pcscd/pcscd.comm || true

      - name: Build
        run: dotnet toolchain.cs build

      - name: Run unit tests
        run: dotnet toolchain.cs test

      - name: Run runtime resilience checks
        run: dotnet toolchain.cs -- resilience --fast

      - name: Pack NuGet packages
        run: dotnet toolchain.cs pack --package-version 2.0.0-alpha.2

      - name: Attest build provenance for packages
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: 'artifacts/packages/*.nupkg'

      - name: Publish to GitHub Packages
        if: github.event_name == 'push'
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet toolchain.cs publish-remote --nuget-feed-url https://nuget.pkg.github.com/Yubico/index.json
