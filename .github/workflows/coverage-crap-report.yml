name: Complexity, coverage, and CRAP report

# Posts one sticky pull request comment with two sections, each owned by one job:
#   - complexity: changed methods over the complexity thresholds. Source only, so it
#     needs no build and no tests and appears within a couple of minutes.
#   - crap: per-module coverage and CRAP, head versus base. Two full coverage passes.
# Both are advisory; neither fails the pull request.

on:
  pull_request:
    branches: [ yubikit*, yubikit/** ]
    # Only run when the numbers could actually move. Of the four most recent pull requests
    # to yubikit, all four touched no .cs file at all.
    #
    # Two groups of paths matter:
    #   - the measured code. src/**/*.cs covers production and tests alike, and tests belong
    #     here because adding a test changes coverage, which is the point of the CRAP report.
    #   - the measuring apparatus. A change to the metric scripts or the coverage plumbing
    #     changes the numbers without touching a single line of src/, so it must be
    #     validated too.
    paths:
      - 'src/**/*.cs'
      - 'crap.cs'
      - 'complexity.cs'
      - 'scripts/code-metrics/**'
      - '.github/scripts/report-comment*.js'
      - 'global.json'
      - 'toolchain.cs'
      - 'coverlet.runsettings.xml'
      - '.config/dotnet-tools.json'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - '.github/workflows/coverage-crap-report.yml'

# A new push supersedes the previous run. Cancelling it saves two coverage passes and stops a
# stale run from overwriting the comment with older numbers after the new run has written it.
concurrency:
  group: coverage-crap-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  complexity:
    name: Complexity report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # The pull request's own head commit rather than the merge commit, so line numbers
          # and source links match what reviewers see. Full history for the merge base.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Test the report comment helper
        run: node .github/scripts/report-comment.test.js

      - name: Check changed methods
        # Head versus merge base is the same diff as the pull request's "Files changed" tab.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LINK_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha }}/
        run: |
          base="$(git rev-parse --short "$(git merge-base HEAD "$BASE_SHA")")"
          dotnet complexity.cs --markdown --base "$base" --top 50 --link-base "$LINK_BASE" > "$RUNNER_TEMP/complexity.md"
          cat "$RUNNER_TEMP/complexity.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Update pull request comment
        # Forks get a read-only GITHUB_TOKEN; they still get the job summary above.
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const { upsertSection } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/report-comment.js`);
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/complexity.md`, 'utf8');
            await upsertSection({ github, context, section: 'complexity', body });

  coverage-crap-report:
    name: Coverage and CRAP report
    # Waiting for the complexity job serializes the two writes to the shared comment. It
    # still runs when that job failed, so one broken report never hides the other.
    needs: complexity
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # Full history: the base measurement step below needs to `git checkout` the PR's
          # base commit, which a shallow clone would not contain.
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install PC/SC dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pcscd libpcsclite-dev libudev-dev
          # Run pcscd directly (bypasses systemd/socket-activation issues on CI runners)
          # and open socket permissions so the test runner user can connect
          sudo mkdir -p /run/pcscd
          sudo pcscd --foreground &
          # Wait for socket to appear (more robust than fixed sleep)
          timeout 10 bash -c 'until [ -S /run/pcscd/pcscd.comm ]; do sleep 0.2; done' || true
          # Open socket read/write for the runner user (sockets don't need +x)
          sudo chmod 666 /run/pcscd/pcscd.comm || true

      - name: Measure head coverage and CRAP
        run: |
          dotnet toolchain.cs coverage
          dotnet toolchain.cs -- crap --crap-args "--json artifacts/crap/head.json"

      - name: Preserve head measurement and measurement tooling
        # Two separate reasons to copy things out before the base checkout:
        #
        # 1. artifacts/ and head.json would be clobbered by the base build.
        #
        # 2. The measurement tooling must be held CONSTANT across both sides. The base
        #    commit is measured with the *head* commit's crap.cs, toolchain.cs and coverage
        #    settings, so only the source differs. Otherwise a PR that touches crap.cs -
        #    such as this one - compares two different metrics and the delta is meaningless.
        #    It also avoids a bootstrap problem: a base predating a fix to the coverage
        #    tooling cannot measure itself.
        run: |
          mkdir -p "$RUNNER_TEMP/head-coverage" "$RUNNER_TEMP/tooling"
          cp -r artifacts/coverage/. "$RUNNER_TEMP/head-coverage/"
          cp artifacts/crap/head.json "$RUNNER_TEMP/head.json"
          cp crap.cs toolchain.cs coverlet.runsettings.xml "$RUNNER_TEMP/tooling/"
          cp .config/dotnet-tools.json "$RUNNER_TEMP/tooling/dotnet-tools.json"
          # crap.cs pulls its shared code in with #:include, so it travels with it.
          cp -r scripts/code-metrics "$RUNNER_TEMP/tooling/code-metrics"

      - name: Cache base measurement
        id: base-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/base.json
          # The base is measured with the head's tooling (see above), so the tooling is part
          # of what the cached result depends on. Keying on the base commit alone would reuse
          # a measurement taken with older tooling.
          key: crap-base-${{ github.event.pull_request.base.sha }}-${{ hashFiles('crap.cs', 'scripts/code-metrics/**', 'toolchain.cs', 'coverlet.runsettings.xml', '.config/dotnet-tools.json') }}

      - name: Measure base coverage and CRAP
        if: steps.base-cache.outputs.cache-hit != 'true'
        run: |
          # Capture the exact commit to return to. `git checkout -` would usually work, but
          # pull_request events check out a detached merge ref, and relying on the shell's
          # notion of "previous ref" across a long build is needless risk.
          head_sha="$(git rev-parse HEAD)"
          git checkout --detach ${{ github.event.pull_request.base.sha }}

          # Measure the base SOURCE with the head's TOOLING - see the preserve step above.
          cp "$RUNNER_TEMP/tooling/crap.cs" crap.cs
          cp "$RUNNER_TEMP/tooling/toolchain.cs" toolchain.cs
          cp "$RUNNER_TEMP/tooling/coverlet.runsettings.xml" coverlet.runsettings.xml
          cp "$RUNNER_TEMP/tooling/dotnet-tools.json" .config/dotnet-tools.json
          rm -rf scripts/code-metrics
          mkdir -p scripts
          cp -r "$RUNNER_TEMP/tooling/code-metrics" scripts/code-metrics

          rm -rf artifacts/coverage
          dotnet toolchain.cs coverage
          dotnet toolchain.cs -- crap --crap-args "--json artifacts/crap/base.json"
          cp artifacts/crap/base.json "$RUNNER_TEMP/base.json"

          # Discard the tooling overlay so the return checkout has a clean tree. The base may
          # predate scripts/code-metrics, in which case the overlay is untracked there and
          # would block the checkout back to head unless removed.
          git checkout -- crap.cs toolchain.cs coverlet.runsettings.xml .config/dotnet-tools.json
          git checkout -- scripts/code-metrics 2>/dev/null || true
          git clean -fdq -- scripts/code-metrics
          git checkout --detach "$head_sha"

      - name: Render coverage and CRAP report
        # The base step returned the worktree to the head commit, so this runs the pull
        # request's crap.cs, the same tooling that measured both sides. It needs the head's
        # coverage data: restoring the preserved artifacts gives the same result as a third
        # coverage pass at none of the cost.
        run: |
          rm -rf artifacts/coverage
          mkdir -p artifacts/coverage
          cp -r "$RUNNER_TEMP/head-coverage/." artifacts/coverage/
          dotnet crap.cs --baseline "$RUNNER_TEMP/base.json" --markdown > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Update pull request comment
        # Forks get a read-only GITHUB_TOKEN; they still get the job summary above.
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const { upsertSection } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/report-comment.js`);
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/report.md`, 'utf8');
            await upsertSection({ github, context, section: 'crap', body });
