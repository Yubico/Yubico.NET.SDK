name: Documentation Scheduler Wrapper

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-yubikit
  cancel-in-progress: false

jobs:
  update:
    uses: Yubico/Yubico.NET.SDK/.github/workflows/docs-update.yml@yubikit
    with:
      migration_reconciliation: true
    secrets: inherit
