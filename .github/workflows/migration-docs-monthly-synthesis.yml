name: Migration Docs Monthly Synthesis

on:
  workflow_dispatch:
  # GitHub schedule triggers run only from the repository default branch.
  # Mirror this workflow to the default branch if monthly synthesis should run automatically.
  schedule:
    - cron: '41 3 1 * *'

# The generator job reads the repository and runs an external tool with an API token; only
# create-pr may write.
permissions:
  contents: read

concurrency:
  group: docs-yubikit
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
    steps:
      - name: Check out yubikit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: yubikit
          persist-credentials: false

      - name: Fetch migration baselines
        run: |
          git fetch origin +refs/heads/develop:refs/remotes/origin/develop
          git fetch origin +refs/heads/yubikit:refs/remotes/origin/yubikit

      - name: Build migration context
        shell: bash
        run: |
          bash ./scripts/migration/build-migration-context.sh \
            --mode update \
            --v1-baseline origin/develop \
            --v2-branch origin/yubikit \
            --base-range origin/yubikit~1..HEAD \
            --output-dir .migration-context

      - name: Synthesize migration documentation
        uses: anthropics/claude-code-action@769e3bdff9bb7ecfb51bad4c9cba23d6f5fc5ea5 # v1.0.163
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Read and follow `.github/prompts/migration-docs-monthly-synthesis.md`.
            The generated context is in `.migration-context/`.
            Improve only migration documentation files.
          claude_args: >-
            --model opus
            --allowedTools Read,Grep,Glob,Edit,Write

      - name: Enforce migration-only edits
        shell: bash
        run: |
          outside="$(git status --porcelain --untracked-files=all | while IFS= read -r line; do
            path="${line#???}"
            case "$path" in
              docs/migration/v1-to-v2.md|docs/migration/v1-to-v2-map.yml|docs/migration/v1-to-v2-changelog.md|docs/migration/.state.yml|.migration-context/*) ;;
              *) printf '%s\n' "$path" ;;
            esac
          done)"
          if [[ -n "$outside" ]]; then
            echo "Migration docs automation edited files outside its allowed artifacts:" >&2
            printf '%s\n' "$outside" >&2
            exit 1
          fi

      - name: Create migration patch
        id: patch
        shell: bash
        run: |
          git add -N docs/migration
          git diff --binary -- docs/migration > migration.patch
          echo "has_changes=$([[ -s migration.patch ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload migration patch
        if: ${{ steps.patch.outputs.has_changes == 'true' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: migration-synthesis-patch
          path: migration.patch
          if-no-files-found: error

  create-pr:
    needs: synthesize
    if: ${{ needs.synthesize.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out yubikit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: yubikit

      - name: Download migration patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: migration-synthesis-patch
          path: patches

      - name: Apply migration patch
        shell: bash
        run: |
          python3 scripts/docs/apply-docs-patch.py migration patches/migration.patch
          git diff --cached --check

      - name: Create migration synthesis PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automation/migration-docs-monthly-synthesis
          base: yubikit
          title: Polish v1 to v2 migration documentation
          commit-message: "docs: polish migration documentation"
          body: |
            Monthly synthesis pass for v1-to-v2 migration documentation.

            Review for clarity, excessive confidence, and remaining manual-review gaps.
          add-paths: |
            docs/migration/v1-to-v2.md
            docs/migration/v1-to-v2-map.yml
            docs/migration/v1-to-v2-changelog.md
            docs/migration/.state.yml
