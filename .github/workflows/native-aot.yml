name: Native AOT Publish Gate (2.0)

# Publish-and-run verification for the macOS Native AOT host.
#
# The host references every supported SDK library, so publishing provides link evidence for all
# ten libraries. Running it with no attached key provides process-startup evidence and exercises
# the ordinary Core discovery entry point. It cannot prove that every discovery transport loaded.
# This workflow does not exercise hardware, monitoring, or applet operations.
# See docs/NATIVE-AOT.md for the evidence matrix.

on:
  push:
    branches: [ yubikit*, yubikit/** ]
  pull_request:
    branches: [ yubikit*, yubikit/** ]

jobs:
  native-aot-publish:
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      NativeShimsPackageVersion: "1.17.4-prerelease.20260825.3"
      NuGetPackageSourceCredentials_yubico_internal: "Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic"
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: "10.0.x"

      - name: Configure internal NativeShims package source
        shell: pwsh
        run: |
          dotnet nuget add source https://nuget.pkg.github.com/Yubico/index.json --name yubico_internal --configfile nuget.config

          [xml]$config = Get-Content -Raw nuget.config
          $mapping = $config.CreateElement("packageSourceMapping")
          $publicSource = $config.CreateElement("packageSource")
          $publicSource.SetAttribute("key", "nuget.org")
          $publicPattern = $config.CreateElement("package")
          $publicPattern.SetAttribute("pattern", "*")
          [void]$publicSource.AppendChild($publicPattern)
          [void]$mapping.AppendChild($publicSource)
          $internalSource = $config.CreateElement("packageSource")
          $internalSource.SetAttribute("key", "yubico_internal")
          $internalPattern = $config.CreateElement("package")
          $internalPattern.SetAttribute("pattern", "Yubico.NativeShims")
          [void]$internalSource.AppendChild($internalPattern)
          [void]$mapping.AppendChild($internalSource)
          [void]$config.configuration.AppendChild($mapping)
          $config.Save((Resolve-Path nuget.config).Path)

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Publish Native AOT verification host (${{ matrix.rid }})
        run: >
          dotnet publish verification/NativeAotVerification/Yubico.YubiKit.NativeAotVerification.csproj
          -c Release -r ${{ matrix.rid }} --self-contained -p:PublishAot=true

      - name: Verify NativeShims is statically linked
        run: |
          PUBLISH_DIR="verification/NativeAotVerification/bin/Release/net10.0/${{ matrix.rid }}/publish"
          BIN="$PUBLISH_DIR/Yubico.YubiKit.NativeAotVerification"
          SIDECARS="$(find "$PUBLISH_DIR" -type f \( -name 'libYubico.NativeShims.dylib' -o -name 'libYubico.NativeShims.so' -o -name 'Yubico.NativeShims.dll' \) -print)"
          if [[ -n "$SIDECARS" ]]; then
            echo "NativeShims sidecar found under publish output:"
            echo "$SIDECARS"
            exit 1
          fi

          OTOOL_OUTPUT="$(otool -L "$BIN")"
          if [[ "$OTOOL_OUTPUT" =~ Yubico.NativeShims|libcrypto|libssl ]]; then
            echo "NativeShims or OpenSSL remains a dynamic dependency:"
            echo "$OTOOL_OUTPUT"
            exit 1
          fi

      - name: Run direct NativeShims probe (no fallback)
        working-directory: verification/NativeAotVerification/bin/Release/net10.0/${{ matrix.rid }}/publish
        run: |
          BIN="./Yubico.YubiKit.NativeAotVerification"
          chmod +x "$BIN"
          "$BIN" --native-shims-probe

      - name: Run published Native AOT binary (Core discovery entry point)
        working-directory: verification/NativeAotVerification/bin/Release/net10.0/${{ matrix.rid }}/publish
        run: |
          BIN="./Yubico.YubiKit.NativeAotVerification"
          chmod +x "$BIN"
          output="$($BIN)"
          printf '%s\n' "$output"
          test "$(printf '%s\n' "$output" | grep -c '^  Linked module entry type: ')" -eq 10
          printf '%s\n' "$output" | grep -Fx 'Found 0 YubiKey(s).'
