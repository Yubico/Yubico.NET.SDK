name: Native AOT Publish Gate (2.0)

# Publish-and-run verification on macOS, Linux, and Windows.
#
# The host references every supported SDK library, so publishing provides link evidence for all
# ten libraries. Running it with no attached key provides process-startup evidence and exercises
# the ordinary Core discovery entry point. It cannot prove that every discovery transport loaded.
# This workflow does not exercise hardware, monitoring, or applet operations.
# See docs/NATIVE-AOT.md for the evidence matrix.

on:
  push:
    branches: [ yubikit*, yubikit/** ]
  pull_request:
    branches: [ yubikit*, yubikit/** ]

jobs:
  native-aot-publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      # Never pass private-feed access to code from fork pull requests.
      NuGetPackageSourceCredentials_Yubico_GH: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('Username={0};Password={1}', github.actor, secrets.GITHUB_TOKEN) || '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: "10.0.x"

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcsclite-dev libudev-dev

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Publish Native AOT verification host (${{ matrix.rid }})
        run: >
          dotnet publish verification/NativeAotVerification/Yubico.YubiKit.NativeAotVerification.csproj
          -c Release -r ${{ matrix.rid }} --self-contained -p:PublishAot=true

      - name: Run published Native AOT binary (Core discovery entry point)
        timeout-minutes: 5
        shell: bash
        working-directory: verification/NativeAotVerification/bin/Release/net10.0/${{ matrix.rid }}/publish
        run: |
          BIN="./Yubico.YubiKit.NativeAotVerification${{ runner.os == 'Windows' && '.exe' || '' }}"
          chmod +x "$BIN"
          output="$("$BIN" | tr -d '\r')"
          printf '%s\n' "$output"
          test "$(printf '%s\n' "$output" | grep -c '^  Linked module entry type: ')" -eq 10
          printf '%s\n' "$output" | grep -Fx 'Found 0 YubiKey(s).'
