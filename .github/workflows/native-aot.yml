name: Native AOT Publish Gate (2.0)

# Publish-and-run verification for the macOS Native AOT host.
#
# The host references every supported SDK library, so publishing provides link evidence for all
# ten libraries. Running it with no attached key provides process-startup and zero-device Core
# discovery evidence. This workflow does not exercise hardware, monitoring, or applet operations.
# See docs/NATIVE-AOT.md for the evidence matrix.

on:
  push:
    branches: [ yubikit*, yubikit/** ]
  pull_request:
    branches: [ yubikit*, yubikit/** ]

jobs:
  native-aot-publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Publish Native AOT verification host (${{ matrix.rid }})
        run: >
          dotnet publish verification/NativeAotVerification/Yubico.YubiKit.NativeAotVerification.csproj
          -c Release -r ${{ matrix.rid }} --self-contained -p:PublishAot=true

      - name: Run published Native AOT binary (zero-device Core discovery)
        working-directory: verification/NativeAotVerification/bin/Release/net10.0/${{ matrix.rid }}/publish
        run: |
          BIN="./Yubico.YubiKit.NativeAotVerification"
          chmod +x "$BIN"
          output="$($BIN)"
          printf '%s\n' "$output"
          test "$(printf '%s\n' "$output" | grep -c '^  Linked module entry type: ')" -eq 10
          printf '%s\n' "$output" | grep -Fx 'Found 0 YubiKey(s).'
