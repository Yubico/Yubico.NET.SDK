<!doctype html>
<meta charset="utf-8">
<title>YubiKit .NET v2 — diagram viewer</title>
<style>
  :root { --bg:#0f1720; --panel:#16202b; --line:#27384a; --fg:#e8eef4; --dim:#8ba0b5; --acc:#4a9eda; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
         background: var(--bg); color: var(--fg); display: grid;
         grid-template-columns: 264px 1fr; grid-template-rows: auto 1fr; height: 100vh; }

  header { grid-column: 1 / -1; background: var(--panel); border-bottom: 1px solid var(--line);
           padding: 10px 18px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header b { font-size: 15px; letter-spacing: .2px; }
  header .sha { color: var(--dim); font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
  header a { color: var(--acc); text-decoration: none; font-size: 13px; }
  header a:hover { text-decoration: underline; }
  header .spacer { flex: 1; }

  nav { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 10px 0; }
  nav button { display: block; width: 100%; text-align: left; background: none; border: 0;
               color: var(--fg); font: inherit; padding: 9px 16px; cursor: pointer; border-left: 3px solid transparent; }
  nav button:hover { background: #1d2a37; }
  nav button.on { background: #1d2a37; border-left-color: var(--acc); color: #fff; }
  nav button small { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; }
  nav .grp { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
             padding: 14px 16px 6px; }

  main { position: relative; overflow: hidden; background: #fff; }
  #stage { width: 100%; height: 100%; cursor: grab; }
  #stage:active { cursor: grabbing; }
  #stage svg { display: block; }

  .bar { position: absolute; left: 50%; transform: translateX(-50%); bottom: 18px;
         background: rgba(255,255,255,.97); border: 1px solid #d5dde5; border-radius: 10px;
         padding: 7px 10px; display: flex; gap: 6px; align-items: center;
         backdrop-filter: blur(8px); box-shadow: 0 6px 24px rgba(0,0,0,.4); }
  .bar button { font: inherit; background: #fff; color: #1a1a1a; border: 1px solid #cfd8e0;
                border-radius: 6px; padding: 5px 11px; cursor: pointer; }
  .bar button:hover { background: #eef4fa; border-color: #9fb8cd; }
  .bar .z { min-width: 62px; text-align: center; color: #667;
            font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .bar .sep { width: 1px; height: 22px; background: #d5dde5; margin: 0 3px; }

  .caption { position: absolute; top: 14px; left: 18px; max-width: 62%;
             background: rgba(255,255,255,.94); border: 1px solid #d5dde5;
             border-radius: 8px; padding: 9px 13px; backdrop-filter: blur(8px); }
  .caption h1 { margin: 0 0 3px; font-size: 15px; }
  .caption p { margin: 0; color: #667; font-size: 12px; }
  kbd { background: #f0f3f6; border: 1px solid #d5dde5; border-bottom-width: 2px;
        border-radius: 4px; padding: 1px 5px; font: 11px ui-monospace, Menlo, monospace; }
  .hint { position: absolute; right: 18px; top: 14px; color: #7a8894; font-size: 12px;
          text-align: right; line-height: 1.7; }
</style>

<header>
  <b>YubiKit .NET v2 — diagrams</b>
  <span class="sha">yubikit @ d04d59aa</span>
  <span class="spacer"></span>
  <a href="deck.html">deck (HTML)</a>
  <a href="deck.pdf">deck (PDF)</a>
</header>

<nav id="nav"></nav>

<main>
  <div id="stage"></div>
  <div class="caption"><h1 id="ttl"></h1><p id="sub"></p></div>
  <div class="hint">
    scroll / pinch to zoom &nbsp;·&nbsp; drag to pan<br>
    <kbd>+</kbd> <kbd>−</kbd> zoom &nbsp; <kbd>0</kbd> fit &nbsp; <kbd>1</kbd> 100%<br>
    <kbd>←</kbd> <kbd>→</kbd> or <kbd>J</kbd> <kbd>K</kbd> change diagram &nbsp; <kbd>F</kbd> fullscreen
  </div>
  <div class="bar">
    <button id="prev">◀</button>
    <div class="sep"></div>
    <button id="out">−</button>
    <div class="z" id="pct">100%</div>
    <button id="in">+</button>
    <div class="sep"></div>
    <button id="fit">fit</button>
    <button id="one">1:1</button>
    <div class="sep"></div>
    <button id="full">⛶</button>
    <button id="next">▶</button>
  </div>
</main>

<script src="assets/vendor/panzoom.min.js"></script>
<script>
const DIAGRAMS = [
  { g:"In the deck", f:"L2-layered-stack.svg",            t:"Layered stack",              s:"Host App → SDK → Session → YubiKey. Deck slide 2." , w:1532, h:1939 },
  { f:"L4-connection.svg",                                t:"Connection / transports",   s:"How a session reaches a transport. Deck slide 4." , w:1621, h:1858 },
  { f:"L3-apdu-sequence.svg",                             t:"APDU sequence",             s:"Smart card command exchange. Deck slide 5." , w:2073, h:1071 },
  { f:"L3b-fido2-ctap-sequence.svg",                      t:"FIDO2 / CTAP-HID sequence", s:"CTAP over HID. Deck slide 6." , w:1403, h:985 },
  { f:"L4-discovery.svg",                                 t:"Device discovery",          s:"Enumeration, merge, publish. Deck slide 8." , w:954, h:1267 },
  { f:"observability-before-after.svg",                   t:"Observability: v1 → v2",    s:"500 ms polling → OS notifications + coalescing. Deck slide 13." , w:900, h:420 },
  { g:"Backup — not in the deck", f:"L0-context.svg",     t:"System context",            s:"Kept for questions about where the SDK sits." , w:1584, h:418 },
  { f:"L1-assembly-deps.svg",                             t:"Assembly dependencies",     s:"Kept for questions about package layout." , w:1355, h:374 },
];

const stage = document.getElementById("stage");
const nav = document.getElementById("nav");
let pz = null, idx = -1;

nav.innerHTML = DIAGRAMS.map((d,i) =>
  (d.g ? `<div class="grp">${d.g}</div>` : "") +
  `<button data-i="${i}">${d.t}<small>${d.f}</small></button>`
).join("");
nav.onclick = e => { const b = e.target.closest("button"); if (b) show(+b.dataset.i); };

async function show(i) {
  if (i === idx) return;
  idx = (i + DIAGRAMS.length) % DIAGRAMS.length;
  const d = DIAGRAMS[idx];
  [...nav.querySelectorAll("button")].forEach(b => b.classList.toggle("on", +b.dataset.i === idx));
  document.getElementById("ttl").textContent = d.t;
  document.getElementById("sub").textContent = d.s + "  ·  assets/" + d.f;

  if (pz) { pz.dispose(); pz = null; }
  stage.innerHTML = "";

  // Prefer inlining the SVG: panzoom then transforms the vector itself, so zoom stays
  // crisp at any scale. fetch() is CORS-blocked on file://, so fall back to an <img>
  // wrapper, which still scales as vector in every current browser.
  let target;
  try {
    const svgText = await (await fetch("assets/" + d.f)).text();
    stage.innerHTML = svgText;
    target = stage.querySelector("svg");
    if (!target) throw new Error("no <svg> in response");
    // Size to the intrinsic viewBox so panzoom's transform is the only scaling
    // mechanism; at 100% the SVG self-fits and fit() would then shrink it again.
    const vb0 = target.viewBox && target.viewBox.baseVal;
    target.removeAttribute("width");
    target.removeAttribute("height");
    if (vb0 && vb0.width) {
      target.style.width = vb0.width + "px";
      target.style.height = vb0.height + "px";
    }
    target.style.maxWidth = "none";
    target.style.transformOrigin = "0 0";
  } catch (err) {
    // file:// fallback
    const wrap = document.createElement("div");
    wrap.style.cssText = "width:100%;height:100%;display:flex;align-items:center;justify-content:center";
    const img = document.createElement("img");
    img.src = "assets/" + d.f;
    img.style.cssText = "width:" + d.w + "px;height:auto;max-width:none";
    wrap.appendChild(img);
    stage.innerHTML = "";
    stage.appendChild(wrap);
    await new Promise(r => { img.complete ? r() : (img.onload = r, img.onerror = r); });
    target = wrap;
  }

  pz = panzoom(target, {
    maxZoom: 60, minZoom: 0.05, smoothScroll: false, zoomDoubleClickSpeed: 2.2,
    beforeWheel: () => false,          // wheel always zooms, no modifier needed
    filterKey: () => true,             // we handle keys ourselves
  });
  pz.on("zoom", paint); pz.on("pan", paint);
  fit(); paint();
}

function paint() {
  if (!pz) return;
  document.getElementById("pct").textContent = Math.round(pz.getTransform().scale * 100) + "%";
}

// Reserve room for the floating chrome: caption top-left, hint top-right,
// toolbar bottom-centre. Without this, fit() tucks content under them.
const INSET = { top: 76, right: 32, bottom: 84, left: 32 };

function fit() {
  if (!pz) return;
  const svg = stage.querySelector("svg");
  const r = stage.getBoundingClientRect();
  let w, h;
  if (svg && svg.viewBox && svg.viewBox.baseVal && svg.viewBox.baseVal.width) {
    const vb = svg.viewBox.baseVal; w = vb.width; h = vb.height;
  } else {
    const d = DIAGRAMS[idx]; w = d.w; h = d.h;
  }
  const availW = Math.max(40, r.width  - INSET.left - INSET.right);
  const availH = Math.max(40, r.height - INSET.top  - INSET.bottom);
  const s = Math.min(availW / w, availH / h);
  // The element is sized to its viewBox, so the browser already maps viewBox
  // (x, y) to the element origin. Subtracting vb.x/vb.y again double-corrects
  // and shifts diagrams whose viewBox origin is negative (e.g. "-50 -10 ...").
  pz.zoomAbs(0, 0, 1);
  pz.moveTo(0, 0);
  pz.zoomAbs(0, 0, s);
  pz.moveTo(INSET.left + (availW - w * s) / 2, INSET.top + (availH - h * s) / 2);
  paint();
}

function one() {
  if (!pz) return;
  const r = stage.getBoundingClientRect();
  pz.smoothZoomAbs(r.width / 2, r.height / 2, 1);
  setTimeout(paint, 320);
}

function step(k) {
  if (!pz) return;
  const r = stage.getBoundingClientRect();
  pz.smoothZoom(r.width / 2, r.height / 2, k);
  setTimeout(paint, 320);
}

document.getElementById("in").onclick   = () => step(1.45);
document.getElementById("out").onclick  = () => step(1 / 1.45);
document.getElementById("fit").onclick  = fit;
document.getElementById("one").onclick  = one;
document.getElementById("next").onclick = () => show(idx + 1);
document.getElementById("prev").onclick = () => show(idx - 1);
document.getElementById("full").onclick = () =>
  document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();

addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase();
  if (k === "+" || k === "=") { step(1.45); e.preventDefault(); }
  else if (k === "-" || k === "_") { step(1 / 1.45); e.preventDefault(); }
  else if (k === "0") { fit(); e.preventDefault(); }
  else if (k === "1") { one(); e.preventDefault(); }
  else if (k === "arrowright" || k === "j" || k === " ") { show(idx + 1); e.preventDefault(); }
  else if (k === "arrowleft"  || k === "k") { show(idx - 1); e.preventDefault(); }
  else if (k === "f") { document.getElementById("full").click(); e.preventDefault(); }
});

addEventListener("resize", () => { if (pz) fit(); });
show(0);
</script>
