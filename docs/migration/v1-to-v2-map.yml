    v2: IYubiKey.CreateRawSmartCardSessionAsync(...) / CreateRawFidoHidSessionAsync(...) / CreateRawOtpHidSessionAsync(...) returning RawSmartCardSession / RawFidoHidSession / RawOtpHidSession
    evidence:
