    notes: This range added a new supported "Tier 1: Raw Sessions" access level (docs/architecture/raw-access-tiers.md) that did not previously exist. RawSmartCardSession supplies guarded APDU formatting, chaining, and optional SCP; RawFidoHidSession supplies CTAP HID channel/packet framing, keep-alive handling, and final-command correlation; RawOtpHidSession supplies OTP feature-report framing and outbound CRC generation but does not validate command-specific inbound CRC (the caller must do so). All three select no application, apply no applet feature gates, refuse overlapping operations, and still participate in the connection-session-ownership-enforcement contract. Prefer these over the lower "Tier 2" raw IConnection escape hatch (see low-level-commands) when v1 code built raw APDUs or HID reports by hand; still verify byte-level command/response semantics against v1 and v2 sources before migrating.
