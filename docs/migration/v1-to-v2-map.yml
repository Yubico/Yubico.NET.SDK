  - id: connection-session-ownership-enforcement
    status: manual
    confidence: high
    migration_kind: behavior
    v1: v1 code that opened more than one device/session handle to the same physical YubiKey concurrently; in-process contention was not enforced, so conflicts surfaced (if at all) as an ordinary wire-level failure on the next operation rather than at acquisition
    v2: ConnectionInUseException thrown at acquisition by DeviceConnectionRegistry / ConnectionSessionGuard
    evidence:
      - yubikit:src/Core/src/Devices/ConnectionInUseException.cs
      - yubikit:src/Core/src/Devices/DeviceConnectionRegistry.cs
      - yubikit:src/Core/src/Sessions/ConnectionSessionGuard.cs
      - yubikit:docs/architecture/connection-ownership-and-contention.md
    notes: This range added in-process connection/session ownership enforcement. One physical YubiKey admits one live connection across all of its interfaces, and one connection admits one live ApplicationSession; both are refused at acquisition, before any native open or applet SELECT, instead of failing later on the wire. A second concurrent connection or session throws ConnectionInUseException immediately; dispose the current holder before acquiring the next one. Review any v1 call site that held overlapping connections or sessions against one physical device (for example a background device-info poll running alongside an open applet session); this is unchanged for v1 code that already used one connection/session at a time. Enforcement is in-process only; a different process holding the smart card still surfaces an ordinary platform SCardException such as SCARD_E_SHARING_VIOLATION.
    last_reviewed_commit: d37ae99143fa6e7bf64b6c1c65477e2d555614e6
