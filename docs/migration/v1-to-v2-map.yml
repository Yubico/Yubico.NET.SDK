    notes: PIV PIN-only mode was absent from the initial v2 snapshot (see historical `docs/migration/v1-to-v2-gaps.md` finding 3) and was restored by the `yubikit-gaps` remediation effort. V2 narrows the enable/disable surface to `PivPinOnlyMode.PinProtected` only; PIN-derived mode remains detectable via `GetPinOnlyModeAsync` and recoverable via `RecoverPinOnlyModeAsync`, but cannot be newly enabled (v1's `PinDerived` is a deprecated, weaker mechanism kept only for backwards compatibility). `SetPinOnlyModeAsync` requires the caller to have already authenticated the management key and pass it again explicitly; PIN-derived candidate key material is zeroed internally after each recovery attempt. Review any v1 code enabling `PivPinOnlyMode.PinDerived` manually, since v2 has no enable path for it.
