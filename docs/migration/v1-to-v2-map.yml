  - id: oath-authenticate-and-retry
    status: manual
    confidence: medium
    migration_kind: behavior
    v1: OathSession.KeyCollector-driven automatic authenticate-and-retry on AuthenticationRequired
    v2: IOathSession.AuthenticateAndRetryAsync(operation, passwordProvider, cancellationToken)
    evidence:
      - develop:Yubico.YubiKey/src/Yubico/YubiKey/Oath/OathSession.cs
      - yubikit:src/Oath/src/IOathSession.cs
      - yubikit:docs/plans/yubikit-gaps-remediation/ISA.md
    notes: V1's global `KeyCollector` transparently retried locked-applet operations after collecting a password; the initial v2 snapshot let a locked-device error surface as a raw `ApduException` with no retry helper (historical gap 11). The `yubikit-gaps` remediation effort added `AuthenticateAndRetryAsync`, a module-appropriate (not global-`KeyCollector`) retry wrapper that runs the supplied operation, and on an `OathException` with `Reason == OathFailureReason.Locked` collects a password via the caller-supplied provider, derives and validates the access key, zeroes the derived key, and retries the operation exactly once. Review each v1 KeyCollector-driven OATH call site manually; the retry shape (one retry, explicit password provider callback) differs from v1's unbounded KeyCollector loop.
    last_reviewed_commit: e042280ed7ec03a0250745ff3ff272680e5570b9
